<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmin Altamirano Portfolio</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:30px;
    background:#1e293b;
}

h1{
    color:#38bdf8;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;
}

.gallery img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>Osmin Altamirano</h1>
<p>Electronics • Maintenance • Robotics • Automation</p>
</header>

<div class="container">

<div class="card">
<h2>Experience</h2>
<ul>
<li>Industrial maintenance and electrical systems</li>
<li>Motors, sensors, conveyors, gearboxes</li>
<li>Arduino & ESP32 projects</li>
<li>Robotics and automation systems</li>
<li>TCP/IP remote control systems</li>
</ul>
</div>

<div class="card">
<h2>Gallery</h2>
<div class="gallery" id="gallery"></div>
</div>

</div>

<script>
const gallery = document.getElementById("gallery");

// Cambia este número si quieres más o menos intentos
const MAX_IMAGES = 200;

for (let i = 1; i <= MAX_IMAGES; i++) {

    const img = document.createElement("img");

    // Puedes usar JPG o PNG
    img.src = `${i}.jpg`;

    img.onload = function () {
        gallery.appendChild(img);
    };

    img.onerror = function () {
        // Si no existe la imagen, simplemente no la muestra
        img.remove();
    };
}
</script>

</body>
</html>
