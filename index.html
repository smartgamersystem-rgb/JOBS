<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmin Altamirano Portfolio</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:#1e293b;
}

h1{
    color:#38bdf8;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

.slider{
    position:relative;
    width:100%;
    height:450px;
    overflow:hidden;
    border-radius:12px;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
}

.slider img{
    max-width:100%;
    max-height:100%;
    display:none;
}

button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:#38bdf8;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

#prev{left:10px;}
#next{right:10px;}

.play{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:#22c55e;
}
</style>
</head>

<body>

<header>
<h1>Osmin Altamirano</h1>
<p>Electronics • Maintenance • Robotics • Automation</p>
</header>

<div class="container">

<div class="card">
<h2>Experience</h2>
<ul>
<li>Motors, sensors, conveyors, gearboxes</li>
<li>Arduino / ESP32 systems</li>
<li>Industrial maintenance</li>
<li>TCP/IP robot control systems</li>
</ul>
</div>

<div class="card">
<h2>Image Gallery (Auto Slider)</h2>

<div class="slider">
    <button id="prev">◀</button>
    <button id="next">▶</button>
    <button class="play" id="play">PLAY</button>

    <div id="slides"></div>
</div>

</div>

</div>

<script>

const slides = document.getElementById("slides");

let images = [];
let current = 0;
let playing = false;
let interval;

// CARGA AUTOMÁTICA (1.jpg - 50.jpg)
for(let i=1;i<=50;i++){
    let img = document.createElement("img");
    img.src = i + ".jpg";

    img.onload = function(){
        images.push(img);
        slides.appendChild(img);
        if(images.length === 1) showImage(0);
    };

    img.onerror = function(){
        img.remove();
    };
}

function showImage(index){
    images.forEach(i => i.style.display="none");
    if(images[index]){
        images[index].style.display="block";
    }
    current = index;
}

document.getElementById("next").onclick = function(){
    if(images.length===0) return;
    current = (current+1) % images.length;
    showImage(current);
};

document.getElementById("prev").onclick = function(){
    if(images.length===0) return;
    current = (current-1+images.length) % images.length;
    showImage(current);
};

document.getElementById("play").onclick = function(){

    if(playing){
        clearInterval(interval);
        playing = false;
        this.innerText = "PLAY";
    } else {
        playing = true;
        this.innerText = "STOP";

        interval = setInterval(()=>{
            current = (current+1) % images.length;
            showImage(current);
        },2000);
    }
};

</script>

</body>
</html>
